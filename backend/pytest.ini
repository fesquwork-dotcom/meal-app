# Narrow filter for a single third-party Starlette/FastAPI TestClient deprecation.
# Remove when the project migrates to httpx2 or Starlette drops this warning.
[pytest]
markers =
    smoke: lightweight manual-QA smoke checks (Sprint 9.5)
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning

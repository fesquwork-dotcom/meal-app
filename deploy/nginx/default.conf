# Edge reverse proxy for mealapp.ru (HTTP).
# Compatible with Certbot: after certificates exist, add a listen 443 ssl
# server block (or let certbot --nginx modify this file on the VPS).
#
# Topology:
#   /        → webapp:80  (static SPA)
#   /api/    → backend:8000
#
# Backend port 8000 is not published on the host.

upstream mealapp_backend {
    server backend:8000;
    keepalive 16;
}

upstream mealapp_webapp {
    server webapp:80;
    keepalive 16;
}

server {
    listen 80;
    server_name mealapp.ru www.mealapp.ru;

    # Reasonable upload limit for JSON API bodies
    client_max_body_size 2m;

    # Long menu generation (Claude) — must be >= frontend axios timeout (300s)
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Certbot HTTP-01 (mount webroot at /var/www/certbot on the proxy when enabling TLS)
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://mealapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # WebSocket upgrade headers omitted — API does not use WebSockets.
    }

    location / {
        proxy_pass http://mealapp_webapp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

# Optional catch-all: reject unknown hosts (uncomment on VPS if desired)
# server {
#     listen 80 default_server;
#     server_name _;
#     return 444;
# }

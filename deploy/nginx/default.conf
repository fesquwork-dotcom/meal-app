# Edge reverse proxy for mealapp.ru (HTTP + HTTPS).
#
# Topology:
#   /.well-known/acme-challenge/  → Certbot webroot (HTTP only)
#   HTTP other paths             → 301 HTTPS
#   HTTPS /api/                  → backend:8000
#   HTTPS /                      → webapp:80
#
# Backend port 8000 is not published on the host.

upstream mealapp_backend {
    server backend:8000;
    keepalive 16;
}

upstream mealapp_webapp {
    server webapp:80;
    keepalive 16;
}

# ---------------------------------------------------------------------------
# HTTP :80 — ACME challenges + redirect to HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name mealapp.ru www.mealapp.ru;

    # Certbot HTTP-01 webroot (host MEAL_APP_CERTBOT_WEBROOT → /var/www/certbot).
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS :443
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name mealapp.ru www.mealapp.ru;

    ssl_certificate     /etc/letsencrypt/live/mealapp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mealapp.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 2m;

    # Long menu generation (Claude) — must be >= frontend axios timeout (300s)
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/ {
        proxy_pass http://mealapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://mealapp_webapp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
